<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="orangeText" x1="220" y1="150" x2="440" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Outer Circle -->
  <circle cx="256" cy="256" r="254" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" stroke="url(#borderGrad)" stroke-width="28" fill="none"/>

  <!-- Huge Bold Monogram SC Filling Max Space -->
  <g font-family="'Arial Black', 'Impact', 'Segoe UI Black', sans-serif" font-size="290" font-weight="900" text-anchor="middle">
    <text x="165" y="358" fill="#FFFFFF" letter-spacing="-8">S</text>
    <text x="345" y="358" fill="url(#orangeText)" letter-spacing="-8">C</text>
  </g>
</svg>